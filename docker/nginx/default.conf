server {
    listen 80;
    server_name myeventlane-hold.docker.localhost localhost;
    root /var/www/html/web;
    index index.php index.html;

    # Drupal minimal: route <front> has no controller; pass / to index.php with REQUEST_URI=/home
    # so the holding route (myeventlane_waitlist.holding_home) handles the root URL.
    location = / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param REQUEST_URI /home;
        fastcgi_param QUERY_STRING "";
        fastcgi_pass php:9000;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php:9000;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Do not use a blanket "static extension" block with try_files =404 here.
    # Drupal aggregates CSS/JS under /sites/default/files/{css,js}/; those files
    # must be creatable and reachable. Missing files should fall through to
    # index.php so Drupal can generate them. Core assets under /core/ are still
    # served by try_files in location /.

    client_max_body_size 64m;
}
