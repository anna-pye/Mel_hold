# Install as /etc/nginx/sites-available/myeventlane (Debian/Ubuntu).
# Point root to this project's web/ directory after code is deployed.
# Run certbot to add TLS; it will extend this server block or add a new one.

upstream php_myeventlane {
    server unix:/run/php/php8.3-fpm.sock;
}

server {
    listen 80;
    listen [::]:80;
    server_name myeventlane.com.au www.myeventlane.com.au;

    root /var/www/myeventlane_hold/web;
    index index.php index.html;

    client_max_body_size 64m;

    # Minimal profile: core <front> has no controller; mirror docker-compose nginx.
    location = / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param REQUEST_URI /home;
        fastcgi_param QUERY_STRING "";
        fastcgi_pass php_myeventlane;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php_myeventlane;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~* /(?:README|LICENSE|composer\.(json|lock)|web\.config)$ {
        deny all;
        return 404;
    }
}
