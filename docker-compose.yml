services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${MEL_HTTP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:cached
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    volumes:
      - ./:/var/www/html:cached
    env_file:
      - .env
    environment:
      DRUPAL_DATABASE_HOST: ${DRUPAL_DATABASE_HOST:-db}
      DRUPAL_DATABASE_NAME: ${DRUPAL_DATABASE_NAME:-drupal}
      DRUPAL_DATABASE_USERNAME: ${DRUPAL_DATABASE_USERNAME:-drupal}
      DRUPAL_DATABASE_PASSWORD: ${DRUPAL_DATABASE_PASSWORD:-drupal}
      DRUPAL_DATABASE_PORT: ${DRUPAL_DATABASE_PORT:-3306}
      DRUPAL_BASE_URL: ${DRUPAL_BASE_URL:-http://localhost:8080}
      DRUPAL_HASH_SALT: ${DRUPAL_HASH_SALT:-temporary-dev-salt-change-me}
      WAITLIST_TOKEN_SECRET: ${WAITLIST_TOKEN_SECRET:-dev-token-secret-change-me}
      WAITLIST_IP_PEPPER: ${WAITLIST_IP_PEPPER:-}
      MEL_ENVIRONMENT: ${MEL_ENVIRONMENT:-local}
      MEL_MAIL_MODE: ${MEL_MAIL_MODE:-php}
    depends_on:
      - db
      - mailhog
    working_dir: /var/www/html

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${DRUPAL_DATABASE_NAME:-drupal}
      MARIADB_USER: ${DRUPAL_DATABASE_USERNAME:-drupal}
      MARIADB_PASSWORD: ${DRUPAL_DATABASE_PASSWORD:-drupal}
      MARIADB_ROOT_PASSWORD: ${DRUPAL_DATABASE_ROOT_PASSWORD:-root}
    volumes:
      - mel_db_data:/var/lib/mysql
    ports:
      - "${MEL_DB_PORT:-3306}:3306"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "${MEL_MAILHOG_UI_PORT:-8025}:8025"
      - "${MEL_MAILHOG_SMTP_PORT:-1025}:1025"

volumes:
  mel_db_data:
