myeventlane_hold_theme.settings:
  type: theme_settings
  label: 'MyEventLane Hold settings'
  mapping:
    brand_subtitle:
      type: string
    hero_kicker:
      type: string
    hero_gradient:
      type: string
      label: 'Hero gradient headline line'
    hero_subheading:
      type: string
    hero_title:
      type: string
      label: 'Legacy single headline (fallback if hero_gradient empty)'
    hero_lead:
      type: text
    badges:
      type: text
    organiser_panel_title:
      type: string
    organiser_panel_intro:
      type: text
    organiser_panel_points:
      type: text
      label: 'Organiser panel bullet points, one per line'
    attendee_panel_title:
      type: string
    attendee_panel_intro:
      type: text
    status_title:
      type: string
    status_body:
      type: text
      label: 'Status paragraphs, one per line'
    trust_items:
      type: text
      label: 'Trust badges, one per line'
    waitlist_intro:
      type: text
    waitlist_fineprint:
      type: text
    whats_next_intro:
      type: text
    whats_next:
      type: text
      label: 'Legacy HTML block (used if whats_next_intro empty)'
    facebook_url:
      type: string
    facebook_label:
      type: string
    instagram_url:
      type: string
    instagram_label:
      type: string
    linkedin_url:
      type: string
    linkedin_label:
      type: string
    footer_line_left:
      type: string
    footer_line_right:
      type: string
    footer_note:
      type: text
      label: 'Legacy footer (fallback if footer_line_left empty)'
