organiser_panel_title: 'You run events'
organiser_panel_intro: 'We would like to hear from you before we open. Tell us what you run and we will get in touch. If it is a good fit we will set your first event up with you on a call, not hand you a help article.'
organiser_panel_points: |
  Markets, workshops, local gigs, fundraisers and fetes
  Free RSVP events and paid ticketing in the same place
  Guest lists, reminders, check-in and attendee messaging
  Payments through your own connected Stripe account
attendee_panel_title: 'You go to events'
attendee_panel_intro: 'Leave your email and we will let you know when MyEventLane opens in your area. That is all we will use it for.'
